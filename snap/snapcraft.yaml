name: sdns
adopt-info: sdns
summary: A high-performance DNS resolver with DNSSEC support
description: |
  SDNS is a high-performance, recursive DNS resolver server with DNSSEC support,
  focused on preserving privacy. It supports DNS-over-TLS, DNS-over-HTTPS,
  DNS-over-QUIC, and includes features like caching, rate limiting, and blocklists.

  Features:
  - DNSSEC validation
  - DNS-over-HTTPS (DoH)
  - DNS-over-TLS (DoT)
  - DNS-over-QUIC (DoQ)
  - Built-in cache with prefetching
  - Blocklist support
  - Rate limiting
  - Access control lists
  - Prometheus metrics
  - Extended DNS Errors (EDE) support

confinement: strict
base: core22

# armhf is cross-compiled on amd64, since no hosted runner runs 32-bit ARM.
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]
  - build-on: [amd64]
    build-for: [armhf]

parts:
  sdns:
    plugin: nil
    source: .
    build-packages:
      - git
      - ca-certificates
      - curl
    stage-packages:
      - ca-certificates
    override-pull: |
      craftctl default
      # A release tag builds a stable snap of that release; anything else
      # is a development build.
      cd "$CRAFT_PROJECT_DIR"
      git config --global --add safe.directory "$CRAFT_PROJECT_DIR"
      if tag=$(git describe --tags --exact-match 2>/dev/null); then
        craftctl set version="${tag#v}"
        craftctl set grade=stable
      else
        craftctl set version="$(git describe --tags --always | sed 's/^v//')"
        craftctl set grade=devel
      fi
    override-build: |
      case "${CRAFT_ARCH_BUILD_ON}" in
        amd64) host=amd64 ;;
        arm64) host=arm64 ;;
        *) echo "unsupported build host: ${CRAFT_ARCH_BUILD_ON}"; exit 1 ;;
      esac
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) target=amd64 ;;
        arm64) target=arm64 ;;
        armhf) target=arm ;;
        *) echo "unsupported target: ${CRAFT_ARCH_BUILD_FOR}"; exit 1 ;;
      esac

      go=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -n1)
      curl -fsSL "https://go.dev/dl/${go}.linux-${host}.tar.gz" | tar -C /usr/local -xz
      export PATH=/usr/local/go/bin:$PATH

      go generate
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOOS=linux GOARCH=$target GOARM=6 \
        go build -trimpath -ldflags "-s -w" -o "$CRAFT_PART_INSTALL/bin/sdns"
    prime:
      - bin/sdns
      - etc/ssl/certs/*
      - usr/share/ca-certificates/*

apps:
  sdns:
    command: bin/sdns -c $SNAP_DATA/sdns.conf
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    stop-timeout: 30s
    plugs:
      - network
      - network-bind
      - network-observe
    environment:
      HOME: $SNAP_DATA

  sdns-cli:
    command: bin/sdns -c $SNAP_DATA/sdns.conf
    plugs:
      - network
      - network-bind
    environment:
      HOME: $SNAP_DATA
