name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build -v ./...

      - name: Test
        run: make test

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          # Coverage upload is informational; a Codecov outage or a
          # missing token (e.g. on fork PRs) must not fail the build.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  allocgate:
    name: Allocation gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Pinned deliberately: allocation counts are toolchain-sensitive,
          # and the hard-zero gate's verdict must not drift with "stable".
          # Keep in lockstep with go.mod's toolchain directive.
          go-version: '1.26.5'

      # The main test job runs with -race on every OS, which skips every
      # !race-tagged allocation pin. This job is where they actually run.
      - name: Allocation pins (no race)
        run: go test -count=1 -run 'Alloc' ./...

      - name: Zero gate
        run: go test -count=1 -tags zerogate -run TestZeroGate -timeout 20m -v ./internal/zerogate/
        env:
          ZEROGATE_OPS: "1000000"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
