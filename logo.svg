<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" role="img" aria-label="sdns">
  <title>sdns</title>
  <style>
    @media (prefers-color-scheme: dark)  { .hex { stroke: #dfe6ee; } }
    @media (prefers-color-scheme: light) { .hex { stroke: #101820; } }
