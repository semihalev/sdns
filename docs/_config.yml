title: SDNS
description: A recursive DNS resolver with DNSSEC validation, written in Go.
url: https://sdns.dev
baseurl: ""
permalink: pretty
lang: en

github:
  repository_url: https://github.com/semihalev/sdns
  repository_nwo: semihalev/sdns

# Pre-JavaScript fallback only: the header pill and the release panel are
# corrected from the releases API at view time, so this is what a reader
# sees for the first few hundred milliseconds, or with scripting off. It
# is also the single source for the version written into the install
# commands, which no script can correct, bump it at release.
sdns_version: v1.8.2

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  # Repository tooling that happens to live under docs/, it belongs to CI,
  # not to the published site.
  - check-drift.sh
  - schemakeys

collections:
  docs:
    output: true
    permalink: /:collection/:path/
    sort_by: order

# One defaults block. A second one does not merge, the later key replaces the
# earlier, which would have silently dropped every layout assignment here.
#
# The seo types are set because jekyll-seo-tag treats everything as a
# BlogPosting, and with no date in the front matter it stamps datePublished and
# dateModified with the build time, so each deploy announced all 29 documents
# as freshly written. Reference documentation is not a blog.
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
      seo:
        type: "TechArticle"
  - scope:
      path: ""
    values:
      layout: "default"
      seo:
        type: "WebPage"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
